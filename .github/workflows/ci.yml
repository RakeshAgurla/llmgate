name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests bench
      - run: pytest tests -q --cov=llmgate --cov-report=term-missing

  benchmark:
    # The whole benchmark runs with a fake client, so the routing, caching and
    # guard logic is exercised on every push rather than only when someone
    # remembers to spend money on API calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - run: python -m bench.run --repeats 2
      - name: assert no false cache hits
        run: |
          python -c "
          import json, sys
          d = json.load(open('results/benchmark.json'))
          bad = [a['arm'] for a in d['arms'] if a['false_cache_hits'] > 0]
          if bad:
              print(f'false cache hits in: {bad}'); sys.exit(1)
          print('no false cache hits')"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: results/benchmark.json
